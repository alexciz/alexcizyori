<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cfdGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">ANSYS FLUENT CFD CONJUGATE HEAT TRANSFER &amp; VELOCITY STREAMLINES</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">TURBULENCE MODEL: k-ω SST | y+ &lt; 1 | NUSSELT ENHANCEMENT: +42%</text>

  <!-- Flow Streamlines with Vector Arrows -->
  <g transform="translate(100, 180)">
    <!-- Tube Wall Boundaries -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#f59e0b" stroke-width="6" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#f59e0b" stroke-width="6" />
    <text x="300" y="-12" font-family="'JetBrains Mono', monospace" font-size="10" fill="#f59e0b" text-anchor="middle">COPPER TUBE WALL (ISOTHERMAL 75°C)</text>

    <!-- Internal Helical Swirling Flow Contours -->
    <path d="M 0 30 Q 80 15, 160 50 T 320 50 T 480 50 L 600 50" fill="none" stroke="url(#cfdGrad)" stroke-width="4" />
    <path d="M 0 70 Q 80 110, 160 70 T 320 70 T 480 70 L 600 70" fill="none" stroke="url(#cfdGrad)" stroke-width="6" />
    <path d="M 0 110 Q 80 125, 160 90 T 320 90 T 480 90 L 600 90" fill="none" stroke="url(#cfdGrad)" stroke-width="4" />

    <!-- Velocity Vectors (Arrows) -->
    <g fill="#ffffff" opacity="0.8">
      <polygon points="120,45 130,48 120,51" />
      <polygon points="260,47 270,50 260,53" />
      <polygon points="400,47 410,50 400,53" />

      <polygon points="120,65 130,70 120,75" />
      <polygon points="260,65 270,70 260,75" />
      <polygon points="400,65 410,70 400,75" />

      <polygon points="120,87 130,90 120,93" />
      <polygon points="260,87 270,90 260,93" />
      <polygon points="400,87 410,90 400,93" />
    </g>

    <!-- Vortex Swirl Annotations -->
    <circle cx="160" cy="70" r="28" fill="none" stroke="#eab308" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="160" y="115" font-family="'JetBrains Mono', monospace" font-size="9" fill="#eab308" text-anchor="middle">SECONDARY VORTEX CORE</text>
  </g>

  <!-- Legend -->
  <g transform="translate(100, 390)">
    <rect x="0" y="0" width="600" height="14" fill="url(#cfdGrad)" />
    <text x="0" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444">75°C (Inlet Wall)</text>
    <text x="300" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#eab308" text-anchor="middle">50°C (Core Mixed)</text>
    <text x="600" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3b82f6" text-anchor="end">25°C (Inlet Cold)</text>
  </g>
</svg>
