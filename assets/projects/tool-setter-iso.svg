<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bodyAlum" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="40%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="carbideAnvil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#gridPattern)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">PRECISION CNC TOUCH-TRIGGER TOOL SETTER</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">REPEATABILITY: 3.8 µm (2σ) | IP67 SEALED | PRELOAD: 0.85 N</text>

  <!-- Tool Setter Assembly Drawing (Cutaway View) -->
  <g transform="translate(400, 240)">
    <!-- Base Mounting Magnetic Puck -->
    <ellipse cx="0" cy="160" rx="140" ry="35" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M -140 160 L -140 130 C -140 100, 140 100, 140 130 L 140 160 Z" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Outer Anodized Aluminum Housing Cylinder -->
    <path d="M -90 120 L -90 -40 C -90 -65, 90 -65, 90 -40 L 90 120 Z" fill="url(#bodyAlum)" stroke="#38bdf8" stroke-width="2" />

    <!-- Housing Section Window (Cutaway showing internal Kinematic Mount) -->
    <rect x="-65" y="-30" width="130" height="130" rx="8" fill="#090d16" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" />

    <!-- Internal Kinematic Preload Spring -->
    <path d="M 0 85 Q 15 80, 0 75 Q -15 70, 0 65 Q 15 60, 0 55 Q -15 50, 0 45" fill="none" stroke="#eab308" stroke-width="3" />

    <!-- Kinematic Triangle Star Carrier & Carbide Ball Contacts -->
    <rect x="-50" y="32" width="100" height="14" rx="4" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
    <!-- 3 Kinematic Balls -->
    <circle cx="-35" cy="48" r="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="48" r="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1" />
    <circle cx="35" cy="48" r="8" fill="#f8fafc" stroke="#38bdf8" stroke-width="1" />

    <!-- Spindle Shaft Extending Upward -->
    <rect x="-14" y="-70" width="28" height="102" fill="#64748b" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Viton Rubber Bellows / Diaphragm (Coolant Seal) -->
    <path d="M -45 -55 Q -25 -70, 0 -60 Q 25 -70, 45 -55" fill="none" stroke="#22c55e" stroke-width="3" />
    <text x="58" y="-60" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">IP67 VITON BELLOWS</text>

    <!-- Top Ground Carbide Tool Touch Anvil (Ø20mm Mirror Ground) -->
    <ellipse cx="0" cy="-70" rx="35" ry="10" fill="url(#carbideAnvil)" stroke="#38bdf8" stroke-width="2" />
    <path d="M -35 -70 L -35 -82 C -35 -90, 35 -90, 35 -82 L 35 -70 Z" fill="url(#carbideAnvil)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="0" cy="-82" rx="35" ry="10" fill="#f8fafc" stroke="#38bdf8" stroke-width="2" />

    <!-- Simulated Endmill Contacting the Anvil -->
    <g transform="translate(0, -145)">
      <path d="M -12 0 L 12 0 L 12 55 L 0 63 L -12 55 Z" fill="#475569" stroke="#38bdf8" stroke-width="1.5" />
      <line x1="-12" y1="15" x2="12" y2="25" stroke="#38bdf8" stroke-width="1" />
      <line x1="-12" y1="35" x2="12" y2="45" stroke="#38bdf8" stroke-width="1" />
      <!-- Tool Trigger Flash -->
      <circle cx="0" cy="63" r="6" fill="#ef4444" opacity="0.8" />
      <text x="25" y="45" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444" font-weight="bold">TRIGGER POINT</text>
    </g>
  </g>
</svg>
