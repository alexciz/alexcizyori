<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="modalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="30%" stop-color="#22c55e" />
      <stop offset="70%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">MODAL VIBRATION ANALYSIS: MODE 1 NATURAL FREQUENCY = 312 Hz</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">MOTOR MAX EXCITATION: 200 Hz (12,000 RPM) | RESONANCE MARGIN: +56%</text>

  <!-- Frame Modal Deformation Curve -->
  <g transform="translate(100, 240)">
    <!-- Undeflected Baseline Bed Frame -->
    <line x1="0" y1="50" x2="600" y2="50" stroke="#64748b" stroke-width="2" stroke-dasharray="6 6" />
    <text x="300" y="75" font-family="'JetBrains Mono', monospace" font-size="10" fill="#64748b" text-anchor="middle">UNDEFORMED BASELINE</text>

    <!-- First Bending Mode Harmonic Sine Wave Displacement -->
    <path d="M 0 50 Q 150 -60, 300 50 T 600 50" fill="none" stroke="url(#modalGrad)" stroke-width="6" />

    <!-- Anchor Supports -->
    <polygon points="0,50 -15,75 15,75" fill="#38bdf8" />
    <polygon points="600,50 585,75 615,75" fill="#38bdf8" />

    <!-- Displacement Node & Antinode Callouts -->
    <circle cx="300" cy="50" r="6" fill="#ef4444" />
    <text x="300" y="30" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444" text-anchor="middle">ANTINODE (MAX AMPLITUDE 0.012mm)</text>
  </g>

  <!-- Frequency Response Spectrum Plot (Bottom Right) -->
  <g transform="translate(480, 320)">
    <rect x="0" y="0" width="260" height="110" fill="#1e293b" stroke="#38bdf8" stroke-width="1" rx="4" />
    <line x1="20" y1="90" x2="240" y2="90" stroke="#64748b" stroke-width="1" />
    <line x1="20" y1="20" x2="20" y2="90" stroke="#64748b" stroke-width="1" />
    <!-- Motor Operating Zone Green Bar -->
    <rect x="20" y="30" width="90" height="60" fill="#22c55e" fill-opacity="0.2" />
    <text x="65" y="45" font-family="'JetBrains Mono', monospace" font-size="8" fill="#22c55e" text-anchor="middle">MOTOR 0-200Hz</text>
    <!-- Peak at 312Hz -->
    <path d="M 20 90 L 110 90 L 140 30 L 170 90 L 240 90" fill="none" stroke="#ef4444" stroke-width="2" />
    <text x="140" y="24" font-family="'JetBrains Mono', monospace" font-size="9" fill="#ef4444" text-anchor="middle">312 Hz RESONANCE</text>
  </g>
</svg>
