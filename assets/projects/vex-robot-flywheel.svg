<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="flywheelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#b91c1c" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <pattern id="cleanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#090d16" />
  <rect width="100%" height="100%" fill="url(#cleanGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  <text x="35" y="45" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#38bdf8" font-weight="600">VEX ROBOTICS WORLD CHAMPIONSHIP MECHANISM</text>
  <text x="35" y="65" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94a3b8">TEAM LEAD &amp; DESIGN LEAD | HIGH-SPEED FLYWHEEL LAUNCHER &amp; 4-BAR INTAKE LINKAGE</text>

  <!-- Flywheel Launcher & Linkage Side Profile -->
  <g transform="translate(260, 240)">
    <!-- Base Drivetrain Chassis Rail -->
    <rect x="-160" y="100" width="420" height="24" rx="2" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Virtual Four-Bar Intake Linkage -->
    <g>
      <!-- Intake Lower Arm -->
      <line x1="-120" y1="90" x2="-220" y2="40" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
      <!-- Intake Upper Arm -->
      <line x1="-100" y1="50" x2="-200" y2="0" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" />
      <!-- Intake Roller Head -->
      <circle cx="-210" cy="20" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="-210" y="-12" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#38bdf8" text-anchor="middle">4-BAR INTAKE</text>
    </g>

    <!-- High-RPM Dual Motor Flywheel Assembly -->
    <g transform="translate(60, -20)">
      <!-- Flywheel Disc -->
      <circle cx="0" cy="0" r="75" fill="url(#flywheelGrad)" stroke="#f87171" stroke-width="2" />
      <circle cx="0" cy="0" r="30" fill="#0f172a" stroke="#ffffff" stroke-width="1" />
      <circle cx="0" cy="0" r="8" fill="#ef4444" />

      <!-- Polycarbonate Hood with Pneumatic Actuated Deflector -->
      <path d="M -85 0 C -85 -95, 0 -95, 80 -60" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
      <text x="0" y="-105" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">ADJUSTABLE HOOD DEFLECTOR</text>

      <!-- Disc Trajectory Line -->
      <path d="M 70 -50 Q 180 -140, 360 -180" fill="none" stroke="#22c55e" stroke-width="2" stroke-dasharray="6 4" />
      <circle cx="360" cy="-180" r="6" fill="#22c55e" />
      <text x="375" y="-180" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#22c55e">BALLISTIC TARGET (12FT)</text>
    </g>

    <!-- Awards Strip -->
    <g transform="translate(-140, 160)">
      <rect x="0" y="0" width="560" height="40" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <text x="280" y="25" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">4x TOURNAMENT CHAMPION · 1x SKILLS CHAMPION · EXCELLENCE &amp; DESIGN AWARDS · WORLD QUALIFIER</text>
    </g>
  </g>
</svg>
