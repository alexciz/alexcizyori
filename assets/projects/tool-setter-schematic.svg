<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="elecGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#elecGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">KELVIN CLAMP KINEMATIC COUPLING CIRCUIT (6-POINT ELECTRICAL SERIES)</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">CLOSED LOOP RESISTANCE: &lt; 0.05 Ω | PROPAGATION DELAY: 1.8 µs | NOISE IMMUNITY: OPTOISOLATED</text>

  <!-- Kinematic Tri-Star 6-Contact Layout (Plan View) -->
  <g transform="translate(240, 260)">
    <!-- Central Ground Circle Reference -->
    <circle cx="0" cy="0" r="140" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" stroke-opacity="0.4" />

    <!-- 3 Pairs of Cylindrical Tungsten Carbide Pins (120 deg apart) -->
    <!-- Pair 1: Top (90 deg) -->
    <g transform="translate(0, -110)">
      <rect x="-24" y="-8" width="18" height="16" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <rect x="6" y="-8" width="18" height="16" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="-10" cy="0" r="2" fill="#ef4444" />
      <circle cx="10" cy="0" r="2" fill="#ef4444" />
      <text x="0" y="-18" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">CONTACT 1 &amp; 2</text>
    </g>

    <!-- Pair 2: Bottom Right (330 deg) -->
    <g transform="translate(95, 55)">
      <rect x="-8" y="-24" width="16" height="18" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <rect x="-8" y="6" width="16" height="18" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="0" cy="-10" r="2" fill="#ef4444" />
      <circle cx="0" cy="10" r="2" fill="#ef4444" />
      <text x="25" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">CONTACT 3 &amp; 4</text>
    </g>

    <!-- Pair 3: Bottom Left (210 deg) -->
    <g transform="translate(-95, 55)">
      <rect x="-8" y="-24" width="16" height="18" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <rect x="-8" y="6" width="16" height="18" rx="3" fill="#64748b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="0" cy="0" r="14" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="0" cy="-10" r="2" fill="#ef4444" />
      <circle cx="0" cy="10" r="2" fill="#ef4444" />
      <text x="-105" y="10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8">CONTACT 5 &amp; 6</text>
    </g>

    <!-- Center Moving Anvil Hub -->
    <circle cx="0" cy="0" r="40" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M 0 0 L 0 -110 M 0 0 L 95 55 M 0 0 L -95 55" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.7" />
  </g>

  <!-- Electrical Series Circuit & Opto-isolator Schematic (Right Side) -->
  <g transform="translate(520, 160)">
    <rect x="0" y="0" width="220" height="200" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="110" y="25" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" font-weight="bold">TRIGGER DETECTOR</text>

    <!-- Circuit lines -->
    <path d="M 30 60 L 70 60 M 110 60 L 190 60" stroke="#22c55e" stroke-width="2" />
    <!-- Resistor -->
    <rect x="70" y="52" width="40" height="16" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <text x="90" y="64" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e" text-anchor="middle">10kΩ</text>

    <!-- Optocoupler Box -->
    <rect x="45" y="90" width="130" height="70" rx="4" fill="#0f172a" stroke="#eab308" stroke-width="1.5" />
    <text x="110" y="115" font-family="'JetBrains Mono', monospace" font-size="10" fill="#eab308" text-anchor="middle">PC817 OPTO</text>
    <text x="110" y="135" font-family="'JetBrains Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">5kV ISOLATION</text>

    <!-- CNC Output Signal Indicator -->
    <circle cx="110" cy="180" r="6" fill="#22c55e" />
    <text x="110" y="198" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e" text-anchor="middle">OUTPUT: G31 PROBE ACTIVE</text>
  </g>
</svg>
