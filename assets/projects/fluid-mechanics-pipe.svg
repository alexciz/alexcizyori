<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="curveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <pattern id="cleanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#090d16" />
  <rect width="100%" height="100%" fill="url(#cleanGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  <text x="35" y="45" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#38bdf8" font-weight="600">FLUID MECHANICS PIPE PERFORMANCE &amp; MOODY ANALYSIS</text>
  <text x="35" y="65" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94a3b8">EXPLICIT HAALAND EQUATION | REYNOLDS Re: 4,000–85,000 | 0.1 mm ROUGHNESS SPECIFICATION</text>

  <!-- Moody Chart Plot -->
  <g transform="translate(100, 100)">
    <!-- Axes -->
    <line x1="0" y1="280" x2="600" y2="280" stroke="#64748b" stroke-width="1.5" />
    <line x1="0" y1="0" x2="0" y2="280" stroke="#64748b" stroke-width="1.5" />

    <!-- Grid lines -->
    <line x1="0" y1="70" x2="600" y2="70" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="140" x2="600" y2="140" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="0" y1="210" x2="600" y2="210" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

    <line x1="150" y1="0" x2="150" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="300" y1="0" x2="300" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />
    <line x1="450" y1="0" x2="450" y2="280" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4" />

    <!-- Axis Labels -->
    <text x="300" y="315" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Reynolds Number (Re) [Log Scale: 10⁴ – 10⁵]</text>
    <text x="-15" y="140" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#94a3b8" text-anchor="middle" transform="rotate(-90 -15 140)">Darcy Friction Factor (f)</text>

    <!-- Smooth Pipe Theoretical Curve (Haaland Curve) -->
    <path d="M 0 160 C 150 200, 300 230, 600 255" fill="none" stroke="#22c55e" stroke-width="2.5" />
    <text x="500" y="270" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#22c55e">Smooth Pipe Curve (k = 0.001mm)</text>

    <!-- Defective Pipe Roughness Threshold Curve (k = 0.1 mm) -->
    <path d="M 0 120 C 150 150, 300 165, 600 170" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="6 4" />
    <text x="480" y="158" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#f59e0b">Max Allowable Roughness (k = 0.1mm)</text>

    <!-- Measured Data Points (Batches 1 & 2 Normal, Batches 3 & 5 Defective) -->
    <!-- Normal Points (Green) -->
    <circle cx="120" cy="195" r="5" fill="#22c55e" />
    <circle cx="280" cy="228" r="5" fill="#22c55e" />
    <circle cx="440" cy="250" r="5" fill="#22c55e" />

    <!-- Defective Data Points (Red - Higher Friction Factor) -->
    <g>
      <circle cx="140" cy="100" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="320" cy="115" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      <circle cx="500" cy="122" r="6" fill="#ef4444" stroke="#ffffff" stroke-width="1.5" />
      
      <!-- Error Bar on Outlier -->
      <line x1="320" y1="95" x2="320" y2="135" stroke="#ef4444" stroke-width="1.5" />
      <line x1="315" y1="95" x2="325" y2="95" stroke="#ef4444" stroke-width="1.5" />
      <line x1="315" y1="135" x2="325" y2="135" stroke="#ef4444" stroke-width="1.5" />
    </g>

    <!-- Callout on Defective Result -->
    <g transform="translate(340, 60)">
      <rect x="0" y="0" width="220" height="42" rx="4" fill="#1e293b" stroke="#ef4444" stroke-width="1" />
      <text x="110" y="18" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#ef4444" font-weight="bold" text-anchor="middle">DEFECTIVE BATCH CONFIRMED</text>
      <text x="110" y="32" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#cbd5e1" text-anchor="middle">Measured k = 0.28 mm (&gt; 0.1 mm limit)</text>
    </g>
  </g>
</svg>
