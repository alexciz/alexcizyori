<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="feaHotspot" cx="48%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="25%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="75%" stop-color="#22c55e" />
      <stop offset="95%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
    <linearGradient id="feaLegend" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="20%" stop-color="#3b82f6" />
      <stop offset="40%" stop-color="#22c55e" />
      <stop offset="65%" stop-color="#eab308" />
      <stop offset="85%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
    <pattern id="feaMesh" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 0 L 16 16 M 16 0 L 0 16 M 0 0 L 16 0 L 16 16 L 0 16 Z" fill="none" stroke="#ffffff" stroke-width="0.3" stroke-opacity="0.25" />
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#090d16" />

  <!-- Title & FEA Header -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#ef4444" font-weight="bold">STATIC STRUCTURAL: 3.5G BUMP + 2.0G BRAKING</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">SOLVER: ANSYS WORKBENCH | VON MISES STRESS (MPa) | MIN FOS = 2.34</text>

  <!-- FEA Model with Stress Gradients & Finite Element Mesh -->
  <g transform="translate(380, 250)">
    <!-- Upright Outer Contour with Stress Gradient -->
    <path d="M -90 -160 
             C -40 -170, 40 -170, 90 -160
             C 120 -120, 140 -60, 150 20
             C 155 70, 130 120, 90 140
             C 40 150, -40 150, -90 140
             C -130 110, -150 40, -145 -30
             C -140 -90, -120 -130, -90 -160 Z" 
          fill="url(#feaHotspot)" stroke="#ffffff" stroke-width="0.8" stroke-opacity="0.6" />

    <path d="M -90 -160 
             C -40 -170, 40 -170, 90 -160
             C 120 -120, 140 -60, 150 20
             C 155 70, 130 120, 90 140
             C 40 150, -40 150, -90 140
             C -130 110, -150 40, -145 -30
             C -140 -90, -120 -130, -90 -160 Z" 
          fill="url(#feaMesh)" />

    <!-- Bearing Bore Inner (Low Stress - Blue) -->
    <circle cx="0" cy="5" r="68" fill="#1e3a8a" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.8" />
    <circle cx="0" cy="5" r="68" fill="url(#feaMesh)" />
    <circle cx="0" cy="5" r="45" fill="#090d16" />

    <!-- Caliper Mounting Lugs (High Stress Red/Orange Zone) -->
    <path d="M 125 -65 L 185 -75 L 195 -40 L 140 -35 Z" fill="#ef4444" stroke="#ffffff" stroke-width="0.5" />
    <circle cx="170" cy="-55" r="7" fill="#090d16" stroke="#ffffff" stroke-width="1" />
    
    <path d="M 125 55 L 185 65 L 195 30 L 140 25 Z" fill="#f97316" stroke="#ffffff" stroke-width="0.5" />
    <circle cx="170" cy="45" r="7" fill="#090d16" stroke="#ffffff" stroke-width="1" />

    <!-- Stress Contour Iso-lines -->
    <path d="M -60 -100 C -10 -90, 40 -80, 70 -60" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M -80 -20 C -20 -10, 50 -10, 80 10" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />
    <path d="M -60 70 C 0 80, 50 75, 80 60" fill="none" stroke="#ffffff" stroke-width="0.8" stroke-dasharray="2 2" opacity="0.6" />

    <!-- Stress Concentration Callout Marker -->
    <circle cx="130" cy="-50" r="14" fill="none" stroke="#f43f5e" stroke-width="2" />
    <line x1="144" y1="-50" x2="200" y2="-100" stroke="#f43f5e" stroke-width="1.5" />
    <line x1="200" y1="-100" x2="260" y2="-100" stroke="#f43f5e" stroke-width="1.5" />
    <text x="205" y="-108" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e" font-weight="bold">σ_max: 214.6 MPa</text>
    <text x="205" y="-90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#cbd5e1">Braking Reaction Lug</text>
  </g>

  <!-- FEA von Mises Color Scale Legend (Right Side) -->
  <g transform="translate(700, 120)">
    <rect x="0" y="0" width="18" height="240" fill="url(#feaLegend)" stroke="#ffffff" stroke-width="0.5" />
    <text x="26" y="10" font-family="'JetBrains Mono', monospace" font-size="10" fill="#ef4444" font-weight="bold">214.6 Max</text>
    <text x="26" y="58" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f97316">171.7</text>
    <text x="26" y="106" font-family="'JetBrains Mono', monospace" font-size="9" fill="#eab308">128.8</text>
    <text x="26" y="154" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">85.9</text>
    <text x="26" y="202" font-family="'JetBrains Mono', monospace" font-size="9" fill="#3b82f6">42.9</text>
    <text x="26" y="244" font-family="'JetBrains Mono', monospace" font-size="9" fill="#60a5fa">0.0 Min</text>
    <text x="-4" y="265" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">Unit: MPa</text>
  </g>
</svg>
