<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a3342" />
      <stop offset="50%" stop-color="#1e2530" />
      <stop offset="100%" stop-color="#121720" />
    </linearGradient>
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="boreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <pattern id="cadGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <!-- Background CAD Grid -->
  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#cadGrid)" />

  <!-- Technical ISO Border & Metadata -->
  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" letter-spacing="2">DWG: FSAE-UPRIGHT-FR-2026</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">SCALE 1:1 | MATERIAL: AL 7075-T6 | TOL: ISO 2768-mK</text>
  <text x="620" y="45" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" font-weight="bold">TOPOLOGY REV. 4</text>

  <!-- Technical Crosshairs -->
  <path d="M 400 60 L 400 440 M 100 250 L 700 250" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="8 4 2 4" stroke-opacity="0.25" />

  <!-- Upright Body (Organic Topology Optimized Ribs) -->
  <g transform="translate(400, 250)">
    <!-- Shadow / Projection -->
    <path d="M -130 140 L 130 140 L 170 170 L -100 170 Z" fill="#030712" opacity="0.6" />

    <!-- Main Upright Outer Silhouette -->
    <path d="M -90 -160 
             C -40 -170, 40 -170, 90 -160
             C 120 -120, 140 -60, 150 20
             C 155 70, 130 120, 90 140
             C 40 150, -40 150, -90 140
             C -130 110, -150 40, -145 -30
             C -140 -90, -120 -130, -90 -160 Z" 
          fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="2" />

    <!-- Internal Weight-Reduction Topology Pockets -->
    <!-- Top Pocket -->
    <path d="M -45 -135 C -15 -145, 15 -145, 45 -135 C 55 -110, 45 -85, 25 -75 C -5 -70, -35 -75, -45 -95 Z" 
          fill="#0c121e" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.8" />
    
    <!-- Central Main Wheel Bearing Bore -->
    <circle cx="0" cy="5" r="68" fill="url(#boreGrad)" stroke="#38bdf8" stroke-width="2.5" />
    <circle cx="0" cy="5" r="54" fill="#070b12" stroke="#60a5fa" stroke-width="1" stroke-dasharray="3 3" />
    <circle cx="0" cy="5" r="32" fill="#04060a" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="5" r="4" fill="#38bdf8" />

    <!-- Radial Bolt Circle for Wheel Bearing Retainer (4x M6) -->
    <circle cx="0" cy="-44" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="44" cy="5" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="0" cy="54" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <circle cx="-44" cy="5" r="5" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />

    <!-- Caliper Mounting Lugs (Right Side) -->
    <path d="M 125 -65 L 185 -75 L 195 -40 L 140 -35 Z" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="170" cy="-55" r="7" fill="#070b12" stroke="#38bdf8" stroke-width="1.5" />
    
    <path d="M 125 55 L 185 65 L 195 30 L 140 25 Z" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="170" cy="45" r="7" fill="#070b12" stroke="#38bdf8" stroke-width="1.5" />

    <!-- Lower Ball Joint & Steering Arm Mounting Clevis -->
    <path d="M -110 90 L -165 110 L -155 135 L -85 130 Z" fill="url(#metalGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="-135" cy="115" r="8" fill="#070b12" stroke="#38bdf8" stroke-width="1.5" />
    
    <!-- Top Upper Wishbone Spherical Mount -->
    <circle cx="0" cy="-145" r="10" fill="#0c121e" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="0" cy="-145" r="5" fill="#38bdf8" />

    <!-- Chamfer / Highlight Edges -->
    <path d="M -70 -150 C 0 -158, 40 -155, 70 -145" fill="none" stroke="#93c5fd" stroke-width="1.5" opacity="0.7" />
    <path d="M -130 0 C -135 60, -100 110, -70 130" fill="none" stroke="#93c5fd" stroke-width="1.2" opacity="0.6" />
  </g>

  <!-- Dimension Lines & Annotations -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.8">
    <!-- Top Mount to Center Height -->
    <line x1="220" y1="105" x2="220" y2="255" />
    <line x1="210" y1="105" x2="230" y2="105" />
    <line x1="210" y1="255" x2="230" y2="255" />
    <text x="175" y="185" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8" text-anchor="middle" transform="rotate(-90 175 185)">150.00 ±0.05</text>

    <!-- Caliper Lug Pitch -->
    <line x1="610" y1="195" x2="610" y2="295" />
    <line x1="600" y1="195" x2="620" y2="195" />
    <line x1="600" y1="295" x2="620" y2="295" />
    <text x="635" y="250" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">100.00 CTRS</text>

    <!-- Bearing Bore Callout -->
    <path d="M 400 255 L 490 350 L 580 350" fill="none" />
    <text x="500" y="342" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38bdf8">Ø68.000 +0.012/-0.000 (H7)</text>
    <text x="500" y="365" font-family="'JetBrains Mono', monospace" font-size="9" fill="#94a3b8">CYLINDRICITY 0.005 | Ra 0.4 µm</text>
  </g>
</svg>
