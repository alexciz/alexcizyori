<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <radialGradient id="cycloidMat" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </radialGradient>
    <pattern id="dotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#38bdf8" fill-opacity="0.15" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">CYCLOIDAL SPEED REDUCER (29:1 RATIO)</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">EPITROCHOID TOOTH PROFILE: N=29 LOBES | PIN CIRCLING: 30 PINS | BACKLASH &lt; 0.18°</text>

  <!-- Cycloidal Outer Ring with Hardened Steel Pins -->
  <g transform="translate(400, 260)">
    <!-- Outer Housing Ring -->
    <circle cx="0" cy="0" r="185" fill="#0f172a" stroke="#475569" stroke-width="12" />
    <circle cx="0" cy="0" r="172" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 4" />

    <!-- 30 Peripheral Roller Pins -->
    <!-- Draw ring of pins using circular distribution -->
    <g id="pins">
      <!-- 30 pins generated symmetrically -->
      <circle cx="0" cy="-160" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="33.2" cy="-156.5" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="65.0" cy="-146.2" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="94.0" cy="-129.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="119.0" cy="-106.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="138.5" cy="-79.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="151.8" cy="-49.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="158.4" cy="-16.7" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="158.4" cy="16.7" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="151.8" cy="49.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="138.5" cy="79.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="119.0" cy="106.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="94.0" cy="129.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="65.0" cy="146.2" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="33.2" cy="156.5" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="0" cy="160" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-33.2" cy="156.5" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-65.0" cy="146.2" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-94.0" cy="129.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-119.0" cy="106.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-138.5" cy="79.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-151.8" cy="49.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-158.4" cy="16.7" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-158.4" cy="-16.7" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-151.8" cy="-49.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-138.5" cy="-79.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-119.0" cy="-106.9" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-94.0" cy="-129.4" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-65.0" cy="-146.2" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
      <circle cx="-33.2" cy="-156.5" r="7" fill="#f8fafc" stroke="#64748b" stroke-width="1" />
    </g>

    <!-- Cycloidal Disc (Epitrochoid Wavy Disc, Offset by Eccentric Cam) -->
    <g transform="translate(6, -4)">
      <!-- Disc body with 29 lobes approximation -->
      <circle cx="0" cy="0" r="148" fill="url(#cycloidMat)" stroke="#e0f2fe" stroke-width="2" opacity="0.9" />

      <!-- Output Torque Transmission Holes (6x with internal drive rollers) -->
      <g>
        <circle cx="0" cy="-70" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="4" cy="-68" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />

        <circle cx="60.6" cy="-35" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="64.6" cy="-33" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />

        <circle cx="60.6" cy="35" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="64.6" cy="37" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />

        <circle cx="0" cy="70" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="4" cy="72" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />

        <circle cx="-60.6" cy="35" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="-56.6" cy="37" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />

        <circle cx="-60.6" cy="-35" r="26" fill="#090d16" stroke="#e0f2fe" stroke-width="1.5" />
        <circle cx="-56.6" cy="-33" r="14" fill="#f8fafc" stroke="#0369a1" stroke-width="1" />
      </g>

      <!-- Center Eccentric Bearing Bore -->
      <circle cx="0" cy="0" r="38" fill="#090d16" stroke="#38bdf8" stroke-width="2" />
      <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" />
      <!-- Eccentricity Indicator (e = 1.8mm) -->
      <line x1="-6" y1="4" x2="0" y2="0" stroke="#f43f5e" stroke-width="2" />
      <circle cx="-6" cy="4" r="3" fill="#f43f5e" />
    </g>
  </g>

  <!-- Technical Callout -->
  <text x="600" y="380" font-family="'JetBrains Mono', monospace" font-size="11" fill="#f43f5e">Eccentricity e = 1.8 mm</text>
  <text x="600" y="400" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">Pure Rolling Contact Ratio: 96.2%</text>
</svg>
