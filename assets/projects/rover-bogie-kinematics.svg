<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <pattern id="kinGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#kinGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8">ROCKER-BOGIE STEP CLIMBING KINEMATICS (220mm OBSTACLE)</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">CHASSIS PITCH ATTENUATION: 50% VIA TOP DIFFERENTIAL LINK BAR</text>

  <!-- Obstacle Step Profile (220mm high basalt boulder) -->
  <path d="M 50 380 L 480 380 L 480 230 L 750 230" fill="none" stroke="#eab308" stroke-width="2.5" />
  <text x="490" y="320" font-family="'JetBrains Mono', monospace" font-size="11" fill="#eab308">220mm STEP</text>

  <!-- Articulated Rover Climbing the Step -->
  <g transform="translate(360, 240)">
    <!-- Chassis Body (Remains relatively level at ~12 deg pitch) -->
    <g transform="rotate(-12)">
      <rect x="-100" y="-55" width="200" height="70" rx="4" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="-18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">CHASSIS PITCH: -12°</text>
      <!-- Differential Bar Angle Indicator -->
      <line x1="-80" y1="-50" x2="80" y2="-50" stroke="#22c55e" stroke-width="2" />
    </g>

    <!-- Articulated Links -->
    <!-- Front Rocker climbing the top of the step -->
    <path d="M 0 -25 L 170 -60 L 220 -10" fill="none" stroke="#0ea5e9" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Rear Bogie articulated on lower ground -->
    <path d="M 0 -25 L -130 10 L -210 140 M -130 10 L -50 140" fill="none" stroke="#38bdf8" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wheels in Contact -->
    <!-- Front Wheel on Step Top -->
    <circle cx="220" cy="-10" r="32" fill="#0f172a" stroke="#22c55e" stroke-width="3" />
    <!-- Middle Wheel approaching Step -->
    <circle cx="-50" cy="140" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
    <!-- Rear Wheel on Ground -->
    <circle cx="-210" cy="140" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="3" />
  </g>
</svg>
