<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-hs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#141e33"/>
    </linearGradient>
    <linearGradient id="red-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#f87171"/>
    </linearGradient>
    <linearGradient id="cyan-hs" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#bg-hs)"/>
  
  <g stroke="rgba(248, 113, 113, 0.08)" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="400"/>
    <line x1="150" y1="0" x2="150" y2="400"/>
    <line x1="250" y1="0" x2="250" y2="400"/>
    <line x1="350" y1="0" x2="350" y2="400"/>
    <line x1="450" y1="0" x2="450" y2="400"/>
    <line x1="550" y1="0" x2="550" y2="400"/>
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
  </g>

  <!-- Mobile Goal Clamp + Floating Belt Intake + Wall Stake Arm -->
  <!-- Chassis Base -->
  <rect x="170" y="210" width="260" height="80" rx="6" fill="#1e293b" stroke="#f87171" stroke-width="2"/>
  
  <!-- Wheels -->
  <circle cx="210" cy="290" r="30" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
  <circle cx="390" cy="290" r="30" fill="#0f172a" stroke="#f87171" stroke-width="2"/>

  <!-- Rear Fast-Latching Pneumatic Mobile Goal Clamp -->
  <path d="M 170 240 L 100 240 L 90 275 L 120 275" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="100" cy="240" r="5" fill="#38bdf8"/>
  
  <!-- Two-Stage Ring Intake & Redirect Spool -->
  <path d="M 430 250 L 380 140 L 320 140 L 300 200" fill="none" stroke="#f87171" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="430" cy="250" r="14" fill="#334155" stroke="#f87171" stroke-width="2"/>
  <circle cx="380" cy="140" r="14" fill="#334155" stroke="#f87171" stroke-width="2"/>
  
  <!-- Ring Game Elements (Red Torus Rings) -->
  <ellipse cx="450" cy="265" rx="22" ry="9" fill="url(#red-hs)" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="400" cy="160" rx="18" ry="7" fill="url(#red-hs)" stroke="#ffffff" stroke-width="1.5"/>
  <ellipse cx="320" cy="125" rx="18" ry="7" fill="url(#red-hs)" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Articulated Wall Stake Scorer Arm & Ladder Climb Linkage -->
  <line x1="320" y1="210" x2="350" y2="90" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="350" cy="90" r="6" fill="#38bdf8"/>

  <text x="30" y="45" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700" fill="#f8fafc" letter-spacing="1">VEX HIGH STAKES</text>
  <text x="30" y="70" font-family="monospace" font-size="12" fill="#f87171">SEASON 2024–2025 · FAST-LATCH MOGO &amp; RING REDIRECT</text>
</svg>