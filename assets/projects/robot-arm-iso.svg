<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="linkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <pattern id="bgGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.1" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0a0f18" />
  <rect width="100%" height="100%" fill="url(#bgGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
  <text x="35" y="45" font-family="'JetBrains Mono', monospace" font-size="12" fill="#38bdf8" letter-spacing="2">4-DOF ROBOTIC MANIPULATOR (KINEMATIC ASSY)</text>
  <text x="35" y="65" font-family="'JetBrains Mono', monospace" font-size="10" fill="#94a3b8">MAX REACH: 420mm | PAYLOAD: 1.2kg | REPEATABILITY: ±0.35mm</text>

  <!-- Robot Arm Kinematic Rendering -->
  <g transform="translate(180, 400)">
    <!-- Base Turntable Joint (J1) -->
    <ellipse cx="0" cy="0" rx="90" ry="24" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
    <path d="M -90 0 L -90 -30 C -90 -45, 90 -45, 90 -30 L 90 0 Z" fill="url(#linkGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <ellipse cx="0" cy="-30" rx="90" ry="24" fill="#334155" stroke="#38bdf8" stroke-width="2" />
    <text x="0" y="-18" font-family="'JetBrains Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">J1: AZIMUTH (±180°)</text>

    <!-- Shoulder Actuator Housing (J2) -->
    <g transform="translate(0, -60)">
      <circle cx="0" cy="0" r="48" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" />
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="8" fill="#38bdf8" />
      <text x="58" y="5" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0ea5e9">J2: 29:1 CYCLOIDAL</text>

      <!-- Upper Arm Linkage (Length L1 = 180mm) -->
      <path d="M -16 0 L 120 -150 L 148 -130 L 16 20 Z" fill="url(#linkGrad)" stroke="#38bdf8" stroke-width="2" />
      <line x1="0" y1="0" x2="134" y2="-140" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6" />

      <!-- Elbow Actuator Housing (J3) -->
      <g transform="translate(134, -140)">
        <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="#0ea5e9" stroke-width="2.5" />
        <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="0" cy="0" r="6" fill="#38bdf8" />
        <text x="48" y="-10" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0ea5e9">J3: ELBOW</text>

        <!-- Forearm Linkage (Length L2 = 160mm) -->
        <path d="M -12 0 L 150 -60 L 160 -36 L 12 20 Z" fill="url(#linkGrad)" stroke="#38bdf8" stroke-width="2" />

        <!-- Wrist & Gripper (J4) -->
        <g transform="translate(155, -48)">
          <circle cx="0" cy="0" r="22" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <!-- Parallel Gripper Mechanism -->
          <rect x="18" y="-12" width="30" height="24" fill="#334155" stroke="#38bdf8" stroke-width="1.5" />
          <path d="M 48 -18 L 80 -18 L 80 -8 L 56 -8 Z" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1" />
          <path d="M 48 18 L 80 18 L 80 8 L 56 8 Z" fill="#0ea5e9" stroke="#38bdf8" stroke-width="1" />
          <text x="90" y="4" font-family="'JetBrains Mono', monospace" font-size="9" fill="#22c55e">TCP (±0.35mm)</text>
          <circle cx="80" cy="0" r="3" fill="#22c55e" />
        </g>
      </g>
    </g>
  </g>

  <!-- Kinematic Envelope Overlay -->
  <path d="M 180 340 C 350 150, 600 120, 680 280" fill="none" stroke="#22c55e" stroke-width="1" stroke-dasharray="6 4" opacity="0.4" />
</svg>
