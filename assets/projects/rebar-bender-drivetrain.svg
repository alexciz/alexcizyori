<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gearGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="shaftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <pattern id="cleanGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08" />
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#090d16" />
  <rect width="100%" height="100%" fill="url(#cleanGrid)" />

  <rect x="20" y="20" width="760" height="460" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  <text x="35" y="45" font-family="'IBM Plex Mono', monospace" font-size="12" fill="#38bdf8" font-weight="600">COMMERCIAL REBAR BENDER 4-STAGE TRANSMISSION</text>
  <text x="35" y="65" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94a3b8">INPUT: 5.5 kW @ 2,877 RPM → OUTPUT: 10.3 RPM | TORQUE: 5,103 N·m | RATIO: 279.3:1</text>

  <!-- Drivetrain Layout Schematic -->
  <g transform="translate(100, 240)">
    <!-- Welded Structural C-Channel Base -->
    <rect x="-40" y="120" width="680" height="40" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="300" y="145" font-family="'IBM Plex Mono', monospace" font-size="10" fill="#94a3b8" text-anchor="middle">WELDED STRUCTURAL C-CHANNEL BASE FRAME</text>

    <!-- 5.5 kW Induction Motor (Left) -->
    <g transform="translate(20, 30)">
      <rect x="-40" y="-70" width="80" height="140" rx="6" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
      <text x="0" y="-10" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">5.5 kW</text>
      <text x="0" y="10" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#94a3b8" text-anchor="middle">2,877 RPM</text>
      <!-- Motor Output Pinion 1 -->
      <circle cx="65" cy="0" r="18" fill="url(#gearGrad)" stroke="#38bdf8" stroke-width="1.5" />
    </g>

    <!-- Stage 1 -> 2 Countershaft -->
    <g transform="translate(150, 0)">
      <!-- Gear 2 (Driven) -->
      <circle cx="0" cy="0" r="46" fill="url(#gearGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <!-- Pinion 2 -->
      <circle cx="0" cy="0" r="20" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <!-- Pillow Block Bearings -->
      <rect x="-10" y="80" width="20" height="40" fill="#334155" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="-55" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#38bdf8" text-anchor="middle">STAGE 1</text>
    </g>

    <!-- Stage 2 -> 3 Countershaft -->
    <g transform="translate(280, 0)">
      <circle cx="0" cy="0" r="54" fill="url(#gearGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="22" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="-10" y="80" width="20" height="40" fill="#334155" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="-62" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#38bdf8" text-anchor="middle">STAGE 2</text>
    </g>

    <!-- Stage 3 -> 4 Countershaft -->
    <g transform="translate(420, 0)">
      <circle cx="0" cy="0" r="62" fill="url(#gearGrad)" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="0" cy="0" r="24" fill="#0f172a" stroke="#0ea5e9" stroke-width="1.5" />
      <rect x="-10" y="80" width="20" height="40" fill="#334155" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="-70" font-family="'IBM Plex Mono', monospace" font-size="8" fill="#38bdf8" text-anchor="middle">STAGE 3</text>
    </g>

    <!-- Final Output Bull Gear & Bending Turntable (Stage 4) -->
    <g transform="translate(560, 0)">
      <circle cx="0" cy="0" r="82" fill="url(#gearGrad)" stroke="#f59e0b" stroke-width="2.5" />
      <!-- Central Bending Pin / Turntable -->
      <circle cx="0" cy="0" r="32" fill="#0f172a" stroke="#f59e0b" stroke-width="2" />
      <circle cx="0" cy="0" r="8" fill="#f59e0b" />
      <!-- Bending Roller Pin -->
      <circle cx="20" cy="-15" r="7" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.5" />
      <rect x="-12" y="80" width="24" height="40" fill="#334155" stroke="#f59e0b" stroke-width="1.5" />
      <text x="0" y="-90" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#f59e0b" font-weight="bold" text-anchor="middle">FINAL BULL GEAR: 5,103 N·m</text>
    </g>
  </g>

  <!-- Speed & Torque Callout -->
  <g transform="translate(560, 60)">
    <rect x="0" y="0" width="200" height="60" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="100" y="25" font-family="'IBM Plex Mono', monospace" font-size="11" fill="#f59e0b" font-weight="bold" text-anchor="middle">10.3 RPM @ 5,103 N·m</text>
    <text x="100" y="45" font-family="'IBM Plex Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">Rebar Bending Turntable</text>
  </g>
</svg>
